[project]
name = "sneakersearch"
version = "0.1.0"
description = ""
authors = [
    {name = "Inna Bobylina",email = "ivbobylina@edu.hse.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.128.8,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pandas (>=3.0.2,<4.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "transformers (>=5.5.0,<6.0.0)",
    "timm (>=1.0.26,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "qdrant-client (>=1.17.1,<2.0.0)",
    "openai-clip (>=1.0.1,<2.0.0)",
    "aiogram (>=3.27.0,<4.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "selenium (>=4.41.0,<5.0.0)",
    "undetected-chromedriver (>=3.5.5,<4.0.0)",
    "chompjs (>=1.4.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]
